name: Initialize Eight from pinned Ten source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/initialize-eight.yml']
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    if: github.repository == 'bdredenbach/Windows-Eight-Style-Android-Launcher'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import baseline and apply Eight source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e .eight-bootstrap-complete
          git config user.name "An Nth Experience"
          git config user.email "315231832+bdredenbach@users.noreply.github.com"
          stage="$RUNNER_TEMP/eight-source"
          cp -a _eight-bootstrap "$stage"
          git fetch https://github.com/bdredenbach/Windows-Ten-Style-Android-Launcher.git 89cd0dd3d22205bbb43b450b3b4a27d14a7fdfcf
          git merge --allow-unrelated-histories -s ours --no-commit FETCH_HEAD
          git read-tree --reset -u 89cd0dd3d22205bbb43b450b3b4a27d14a7fdfcf
          cp -a "$stage/overlay/." .
          EIGHT_STAGE="$stage" python3 - <<'PY'
          import json, os
          from pathlib import Path
          for item in json.loads((Path(os.environ["EIGHT_STAGE"])/"deletions.json").read_text()):
              path=Path(item)
              if path.is_absolute() or ".." in path.parts: raise RuntimeError("Unsafe deletion path")
              if path.is_file(): path.unlink()
          Path(".eight-bootstrap-complete").write_text("Nth Desktop Eight 0.1.0\nTen baseline: 89cd0dd3d22205bbb43b450b3b4a27d14a7fdfcf\n")
          PY
          git add -A
          git commit -m "Import pinned Ten engines and implement Eight 0.1 with 8 and 8.1 shell profiles"
          git push origin HEAD:main
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/dispatches" -f ref=main; then exit 0; fi
            sleep 5
          done
          exit 1
