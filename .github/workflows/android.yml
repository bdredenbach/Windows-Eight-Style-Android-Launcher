name: Nth Desktop Eight preview and regression
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'THIRD_PARTY_NOTICES.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check horizontal packing and shell profiles
        run: |
          python3 checks/CheckEightSurfaces.py
          mkdir -p build/eight-checks
          javac -d build/eight-checks app/src/main/java/com/nthexperience/desktop/EightProfile.java app/src/main/java/com/nthexperience/desktop/EightTileLayout.java checks/EightTileLayoutCheck.java
          java -cp build/eight-checks com.nthexperience.desktop.EightTileLayoutCheck
          javac -d build/eight-checks app/src/main/java/com/nthexperience/desktop/EightProfile.java app/src/main/java/com/nthexperience/desktop/EightAppSpec.java app/src/main/java/com/nthexperience/desktop/EightSnapPolicy.java checks/EightSnapCheck.java
          java -cp build/eight-checks com.nthexperience.desktop.EightSnapCheck
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug :installprobe:assembleDebug --no-daemon
      - name: Check packaged runners and notification permission
        run: python3 checks/CheckEightManifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: Nth-Desktop-Eight-0.5.0-api-${{ matrix.api }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Eight and shared-engine scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 30 && 'default' || 'aosp_atd' }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash checks/run-eight-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Eight-evidence-api-${{ matrix.api }}
          path: |
            eight-*.txt
            app/build/test-results/testDebugUnitTest/
            screenshots/
